<style>
    /* ==========================================================================
       Accessibility & Screen Reader Utilities
       ========================================================================== */

    /* Skip link for keyboard navigation (logo navy: white text 16.5:1) */
    .skip-link {
        position: absolute;
        top: -48px;
        left: var(--space-sm);
        background: var(--brand-ink);
        color: var(--on-brand);
        padding: var(--space-sm) var(--space-md);
        border-radius: var(--radius-md);
        font-weight: var(--font-weight-semibold);
        z-index: 1000;
        transition: top var(--transition-fast);
    }

    .skip-link:focus {
        top: var(--space-sm);
        outline: 2px solid var(--focus-ring);
        outline-offset: 2px;
    }

    /* ==========================================================================
       Header & Navigation — a floating bar: inset from the viewport edges,
       rounded, solid surface, hairline border and one soft neutral shadow.
       Inner padding (--float-pad: 16 / 24 / 32px) gives the logo and CTA
       room from the card edge; on wide screens the card spans the page
       column, so logo and CTA line up with the page content.
       ========================================================================== */

    .header {
        position: fixed;
        top: var(--float-inset);
        left: var(--float-inset);
        right: var(--float-inset);
        max-width: var(--float-max);
        margin: 0 auto;
        background: var(--float-surface);
        border: 1px solid var(--float-border);
        border-radius: var(--radius-xl);
        box-shadow: var(--float-shadow);
        z-index: 100;
        transition: box-shadow var(--transition-normal), border-color var(--transition-normal), background-color var(--transition-normal);
    }

    /* Scrolled: same float, slightly firmer edge so it separates from content */
    .header--scrolled {
        border-color: var(--border-medium);
        box-shadow: var(--float-shadow-scrolled);
    }

    .nav__container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-lg);
        min-height: 64px;
        padding: var(--space-xs) var(--float-pad);
    }

    @media (min-width: 1024px) {
        .nav__container {
            min-height: 76px;
            padding-top: var(--space-sm);
            padding-bottom: var(--space-sm);
        }
    }

    .nav__brand {
        display: flex;
        align-items: center;
    }

    .nav__logo {
        display: flex;
        align-items: center;
        text-decoration: none;
    }

    .nav__logo:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 2px;
        border-radius: var(--radius-sm);
    }

    .nav__logo-img {
        height: 52px;
        width: auto;
    }

    .nav__toggle {
        display: none;
        flex-direction: column;
        gap: 4px;
        padding: var(--space-sm);
        background: none;
        border: none;
        cursor: pointer;
        min-width: 44px;
        min-height: 44px;
        justify-content: center;
        align-items: center;
        border-radius: var(--radius-md);
    }

    .nav__toggle:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 2px;
    }

    .nav__toggle-line {
        width: 22px;
        height: 2px;
        background-color: var(--text-primary);
        transition: transform var(--transition-fast), opacity var(--transition-fast);
    }

    .nav__toggle--active .nav__toggle-line:nth-child(1) {
        transform: translateY(6px) rotate(45deg);
    }

    .nav__toggle--active .nav__toggle-line:nth-child(2) {
        opacity: 0;
    }

    .nav__toggle--active .nav__toggle-line:nth-child(3) {
        transform: translateY(-6px) rotate(-45deg);
    }

    .nav__menu {
        display: flex;
        align-items: center;
        gap: var(--space-xs);
    }

    .nav__link {
        font-weight: var(--font-weight-medium);
        color: var(--text-secondary);
        transition: color var(--transition-fast);
        padding: var(--space-sm) var(--space-md);
        text-decoration: none;
        min-height: 44px;
        display: flex;
        align-items: center;
    }

    .nav__link:hover {
        color: var(--text-primary);
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 0.3em;
    }

    .nav__link:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 2px;
        border-radius: var(--radius-sm);
    }

    /* CTA: flat logo blue; large-bold label keeps white text AA on #2e7ef6 */
    .nav__item--cta {
        margin-left: var(--space-sm);
    }

    .nav__link--cta,
    .nav__link--cta:hover {
        background: var(--brand-blue);
        color: var(--on-brand);
        font-size: var(--brand-label-size);
        font-weight: var(--font-weight-bold);
        letter-spacing: -0.005em;
        padding: var(--space-sm) var(--space-lg);
        border-radius: var(--radius-md);
        text-decoration: none;
        transition: background-color var(--transition-fast);
    }

    .nav__link--cta:hover,
    .nav__link--cta:active {
        background: var(--brand-blue-hover);
    }

    /* Mobile Navigation: a second floating card just under the bar,
       same surface, border, radius and shadow */
    @media (max-width: 1023px) {
        .nav__toggle {
            display: flex;
        }

        .nav__menu {
            position: absolute;
            top: calc(100% + var(--space-xs));
            left: -1px;
            right: -1px;
            flex-direction: column;
            align-items: stretch;
            gap: 0;
            padding: var(--space-xs) var(--float-pad) var(--space-md);
            background: var(--float-surface);
            border: 1px solid var(--float-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--float-shadow-scrolled);
            /* viewport minus top inset, bar, gap and a bottom inset */
            max-height: calc(100dvh - 64px - var(--space-xs) - 2 * var(--float-inset) - 2px);
            overflow-y: auto;

            /* Hidden state */
            opacity: 0;
            visibility: hidden;
            transform: translateY(-4px);
            transition: opacity var(--transition-fast), transform var(--transition-fast), visibility var(--transition-fast);
        }

        .nav__menu[aria-expanded="true"] {
            opacity: 1;
            visibility: visible;
            transform: none;
        }

        .nav__item {
            border-bottom: 1px solid var(--rule);
        }

        .nav__link {
            padding: var(--space-md) 0;
            font-size: var(--font-size-lg);
            color: var(--text-primary);
        }

        .nav__item--cta {
            border-bottom: 0;
            margin: var(--space-md) 0 0;
        }

        .nav__link--cta,
        .nav__link--cta:hover {
            justify-content: center;
            padding: var(--space-md);
            color: var(--on-brand);
            font-size: var(--brand-label-size);
        }
    }

    @media (max-width: 640px) {
        .nav__logo-img {
            height: 46px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .nav__menu,
        .nav__toggle-line {
            transition: none;
        }
    }
</style>

<!-- Skip to main content link for accessibility -->
<a href="#main-content" class="skip-link">Saltar al contenido principal</a>

<!-- Header -->
<header class="header">
    <nav class="nav" aria-label="Navegación principal">
        <div class="nav__container">
            <div class="nav__brand">
                <a href="/" class="nav__logo" aria-label="On Seguros - Volver al inicio">
                    <img src="/assets/logo.svg" alt="On Seguros Río Cuarto" width="160" height="40"
                        class="nav__logo-img" fetchpriority="high">
                </a>
            </div>

            <button class="nav__toggle" aria-expanded="false" aria-controls="nav-menu"
                aria-label="Abrir menú de navegación">
                <span class="nav__toggle-line" aria-hidden="true"></span>
                <span class="nav__toggle-line" aria-hidden="true"></span>
                <span class="nav__toggle-line" aria-hidden="true"></span>
            </button>

            <ul class="nav__menu" id="nav-menu" role="menubar">
                <li class="nav__item" role="none">
                    <a href="/blog/" class="nav__link" role="menuitem">Blog</a>
                </li>
                <li class="nav__item" role="none">
                    <a href="/faq/" class="nav__link" role="menuitem">Preguntas frecuentes</a>
                </li>
                <li class="nav__item nav__item--cta" role="none">
                    <a href="/agente/" class="nav__link nav__link--cta" role="menuitem">Cotizá con Oni</a>
                </li>
            </ul>
        </div>
    </nav>
</header>
