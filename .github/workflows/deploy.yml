name: Deploy to DreamHost

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Prevent multiple deployments running at once
concurrency:
  group: deploy-dreamhost
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need history to detect changed files

      - name: Install jq
        run: sudo apt-get install -y jq

      # Validate HTML files before deploying
      - name: Validate HTML
        run: |
          echo "✓ Checking HTML files exist..."
          if [ ! -f "index.html" ]; then
            echo "Error: index.html not found"
            exit 1
          fi
          echo "✓ HTML validation passed"

      # Check for common issues
      - name: Pre-deployment checks
        run: |
          echo "Running pre-deployment checks..."
          
          # Check for TODO or FIXME comments
          if grep -r "TODO\|FIXME" *.html *.js *.css 2>/dev/null; then
            echo "Warning: Found TODO/FIXME comments"
          fi
          
          # Verify critical files exist
          files=("index.html" "style.css" "script.js" "robots.txt" "sitemap.xml")
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "Found $file"
            else
              echo "Warning: $file not found"
            fi
          done

      - name: Set up SSH folder
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

      - name: Add SSH key
        run: |
          echo "${{ secrets.DH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add SSH config
        run: |
          echo "${{ secrets.DH_HOST }}" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      # Pinned host keys (no per-run ssh-keyscan, so a spoofed host can't be
      # trusted on first use). Fingerprints, checked 2026-10-17 via ssh-keyscan
      # and an ssh handshake to 173.236.142.111:
      #   ED25519 SHA256:9sWCEFZqAi4Yo0luDY0TlEI2xhJURIdZxyDiR36I9cw
      #   ECDSA   SHA256:c9YnY69RZXvujqTULEBjkerWaxAN3cwmHULeqLLuixs
      #   RSA     SHA256:paTop0PhpfVSl2HULxReoq93i7lWgU2/MwRgGsBWswE
      # If DreamHost rotates its keys the deploy fails with "Host key
      # verification failed": re-check the new fingerprints and update these.
      - name: Add DreamHost to known_hosts
        run: |
          cat >> ~/.ssh/known_hosts << 'EOF'
          iad1-shared-e1-32.dreamhost.com ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBOPQg5HzCWPrRx4FAOBZ/WIaIwXdBuJsdxW6auvID9O1MiZ5OS5kPbx/VPdsuzi9s4UWCyJ4QvTG9D+cQvkgWwc=
          iad1-shared-e1-32.dreamhost.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIdveSv0utaM4Q+okVjMReRZCLwuU6ASIMztHixHmiTj
          iad1-shared-e1-32.dreamhost.com ssh-rsa 
          EOF

      - name: Create config.json from secrets
        run: |
          echo "Creating config.json from GitHub secrets..."
          cat > config.json << 'EOF'
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}",
            "BLOG_BASE_URL": "${{ secrets.BLOG_BASE_URL }}",
            "API_BASE_URL": "${{ secrets.API_BASE_URL }}",
            "GET_POSTS_API_URL": "${{ secrets.GET_POSTS_API_URL }}",
            "GET_POST_API_URL": "${{ secrets.GET_POST_API_URL }}",
            "PUBLISH_API_URL": "${{ secrets.PUBLISH_API_URL }}",
            "UPDATE_API_URL": "${{ secrets.UPDATE_API_URL }}",
            "DELETE_API_URL": "${{ secrets.DELETE_API_URL }}",
            "GET_FAQS_API_URL": "${{ secrets.GET_FAQS_API_URL }}",
            "GET_FAQ_API_URL": "${{ secrets.GET_FAQ_API_URL }}",
            "CREATE_FAQ_API_URL": "${{ secrets.CREATE_FAQ_API_URL }}",
            "UPDATE_FAQ_API_URL": "${{ secrets.UPDATE_FAQ_API_URL }}",
            "DELETE_FAQ_API_URL": "${{ secrets.DELETE_FAQ_API_URL }}",
            "GET_SUBSCRIBERS_API_URL": "${{ secrets.GET_SUBSCRIBERS_API_URL }}",
            "DELETE_SUBSCRIBER_API_URL": "${{ secrets.DELETE_SUBSCRIBER_API_URL }}",
            "AI_QUOTE_API_URL": "${{ secrets.AI_QUOTE_API_URL }}",
            "SUBMIT_HINT_API_URL": "${{ secrets.SUBMIT_HINT_API_URL }}",
            "GET_HINTS_API_URL": "${{ secrets.GET_HINTS_API_URL }}",
            "GET_DRAFTS_API_URL": "${{ secrets.GET_DRAFTS_API_URL }}",
            "UPDATE_DRAFT_API_URL": "${{ secrets.UPDATE_DRAFT_API_URL }}",
            "DISCARD_DRAFT_API_URL": "${{ secrets.DISCARD_DRAFT_API_URL }}",
            "PUBLISH_DRAFT_API_URL": "${{ secrets.PUBLISH_DRAFT_API_URL }}",
            "GENERATE_DRAFT_API_URL": "${{ secrets.GENERATE_DRAFT_API_URL }}",
            "SUBMIT_FAQ_HINT_API_URL": "${{ secrets.SUBMIT_FAQ_HINT_API_URL }}",
            "GET_FAQ_HINTS_API_URL": "${{ secrets.GET_FAQ_HINTS_API_URL }}",
            "GET_FAQ_DRAFTS_API_URL": "${{ secrets.GET_FAQ_DRAFTS_API_URL }}",
            "UPDATE_FAQ_DRAFT_API_URL": "${{ secrets.UPDATE_FAQ_DRAFT_API_URL }}",
            "DISCARD_FAQ_DRAFT_API_URL": "${{ secrets.DISCARD_FAQ_DRAFT_API_URL }}",
            "PUBLISH_FAQ_DRAFT_API_URL": "${{ secrets.PUBLISH_FAQ_DRAFT_API_URL }}",
            "GENERATE_FAQ_DRAFT_API_URL": "${{ secrets.GENERATE_FAQ_DRAFT_API_URL }}"
          }
          EOF
          echo "config.json created successfully"

      # .htaccess (cache + security headers) ships from the repo with this
      # rsync; nothing rewrites it on the server, so live == repo.
      # --delete-excluded also removes excluded paths already on the server
      # (plain --delete protects them): every exclude below is repo-only
      # tooling/docs, nothing that must live on DreamHost. config.json and
      # .htaccess are NOT excluded, so they're always uploaded.
      - name: Deploy via rsync
        run: |
          echo "Starting deployment..."
          rsync -avz --delete --delete-excluded \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.claude' \
            --exclude '.gitignore' \
            --exclude '.DS_Store' \
            --exclude 'README.md' \
            --exclude '/admin/SETUP.md' \
            --exclude '/supabase/' \
            --exclude '/design-system/' \
            --exclude '/package.json' \
            --exclude '/package-lock.json' \
            --exclude '/scripts/' \
            ./ \
            dh_fm2wbe@iad1-shared-e1-32.dreamhost.com:~/onseguros.net/
          echo "Deployment completed successfully!"

      - name: Deployment Summary

        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Site URL**: https://www.onseguros.net" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment failed! Check the logs above for details."
          exit 1