<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error - OnSeguros</title>
  
  <!-- Fonts -->
  <link rel="preload" href="../assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* Self-hosted fonts: copy of the @font-face rules at the top of assets/css/style.css */
    /* latin-ext */
    @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url(../assets/fonts/inter-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    /* latin */
    @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url(../assets/fonts/inter-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    /* latin-ext */
    @font-face {
        font-family: 'Space Grotesk';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url(../assets/fonts/space-grotesk-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    /* latin */
    @font-face {
        font-family: 'Space Grotesk';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url(../assets/fonts/space-grotesk-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    /* Self-contained: this page does not load style.css. Token values are
       copied from assets/css/style.css (:root light / [data-theme="dark"]). */
    :root {
      --color-background: #fbfbfe;
      --color-text: #101016;
      --text-secondary: hsl(240, 16%, 37%);
      --rule: rgba(16, 16, 22, 0.1);
      --rule-strong: var(--color-text);
      --accent-dark: hsl(45, 92%, 52%);
      --brand-blue: #2e7ef6;
      --brand-blue-strong: #0f68eb;
      --brand-blue-hover: hsl(216, 92%, 47%);
      --on-brand: #ffffff;
      --brand-label-size: 1.1875rem;
      --focus-ring: hsl(216, 92%, 42%);
      --status: #b91c1c;
      --radius-md: 0.5rem;
      --transition-fast: 150ms ease-in-out;
    }

    [data-theme="dark"] {
      --color-background: #0a0a0a;
      --color-text: #e8e8e8;
      --text-secondary: hsl(0, 0%, 72%);
      --rule: rgba(232, 232, 232, 0.12);
      --accent-dark: hsl(43, 100%, 48%);
      --focus-ring: hsl(216, 92%, 68%);
      --status: #fca5a5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--color-background);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 3rem 1rem;
    }

    h1, h2, h3 {
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      letter-spacing: -0.02em;
    }

    .card {
      width: 100%;
      max-width: 34rem;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem 1.5rem;
      padding-bottom: 1.25rem;
      border-bottom: 2px solid var(--rule-strong);
    }

    /* logo.svg has ~14% side / ~24% top padding in its viewBox;
       pull it back so the mark aligns with the text column. */
    .logo {
      display: block;
      width: 168px;
      height: auto;
      margin: -13px 0 -13px -23px;
    }

    /* Eyebrow label with the landing's short yellow rule */
    .header h1 {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .header h1::before {
      content: '';
      width: 2rem;
      height: 2px;
      background: var(--accent-dark);
    }

    .content {
      padding: 2.5rem 0;
    }

    /* Status icon: the Lucide SVG used as a mask so it takes the status color */
    .icon {
      display: block;
      width: 28px;
      height: 28px;
      margin-bottom: 1.25rem;
      background-color: var(--status);
      -webkit-mask: url(../assets/icons/circle-x.svg) center / contain no-repeat;
      mask: url(../assets/icons/circle-x.svg) center / contain no-repeat;
    }

    .content h2 {
      font-size: clamp(1.5rem, 1.2rem + 1.2vw, 1.875rem);
      font-weight: 600;
      line-height: 1.15;
      margin-bottom: 1rem;
    }

    .content p {
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.6;
      max-width: 52ch;
      margin-bottom: 1rem;
      overflow-wrap: anywhere;
    }

    .content p strong {
      color: var(--color-text);
      font-weight: 600;
    }

    .content p.note {
      font-size: 0.875rem;
    }

    .content p:last-of-type {
      margin-bottom: 2rem;
    }

    /* Same shape and large-bold label as .btn--primary in style.css:
       white on --brand-blue-strong is 5.0:1; label stays 19px / 700. */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0.875rem 1.75rem;
      border: 2px solid var(--brand-blue-strong);
      border-radius: var(--radius-md);
      background: var(--brand-blue-strong);
      color: var(--on-brand);
      font-family: 'Inter', sans-serif;
      font-size: var(--brand-label-size);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.005em;
      text-decoration: none;
      transition: background-color var(--transition-fast),
        border-color var(--transition-fast);
    }

    .btn:hover,
    .btn:active {
      background: var(--brand-blue-hover);
      border-color: var(--brand-blue-hover);
    }

    .btn:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .footer {
      padding-top: 1.25rem;
      border-top: 1px solid var(--rule);
    }

    .footer p {
      color: var(--text-secondary);
      font-size: 0.8125rem;
    }

    @media (max-width: 480px) {
      .btn {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn {
        transition: none;
      }
    }
  </style>
  
  <script>
    // Dark mode detection
    (function() {
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <div class="card">
    <div class="header">
      <img src="../assets/logo.svg" alt="OnSeguros" class="logo">
      <h1>Newsletter</h1>
    </div>
    <div class="content">
      <span class="icon" aria-hidden="true"></span>
      <h2 id="errorTitle">Error</h2>
      <p id="errorMessage">El enlace de cancelación no es válido o ha expirado.</p>
      <a href="https://www.onseguros.net" class="btn">Volver a OnSeguros</a>
    </div>
    <div class="footer">
      <p>© 2026 OnSeguros · Río Cuarto, Córdoba, Argentina</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const message = params.get('message');
    if (message) {
      document.getElementById('errorMessage').textContent = decodeURIComponent(message);
    }
  </script>
</body>
</html>
