<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancelar suscripción - OnSeguros</title>

  <link rel="preload" href="../assets/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* Self-hosted fonts: copy of the @font-face rules at the top of assets/css/style.css */
    /* latin-ext */
    @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url(../assets/fonts/inter-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    /* latin */
    @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url(../assets/fonts/inter-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    /* latin-ext */
    @font-face {
        font-family: 'Space Grotesk';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url(../assets/fonts/space-grotesk-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    /* latin */
    @font-face {
        font-family: 'Space Grotesk';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url(../assets/fonts/space-grotesk-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    /* Self-contained: this page does not load style.css. Token values are
       copied from assets/css/style.css (:root light / [data-theme="dark"]). */
    :root {
      --color-background: #fbfbfe;
      --color-text: #101016;
      --text-secondary: hsl(240, 16%, 37%);
      --rule: rgba(16, 16, 22, 0.1);
      --rule-strong: var(--color-text);
      --border-dark: rgba(16, 16, 22, 0.3);
      --surface-band: hsl(40, 30%, 96%);
      --accent-dark: hsl(45, 92%, 52%);
      --focus-ring: hsl(216, 92%, 42%);
      --danger: #dc2626;          /* white text 4.8:1 */
      --danger-hover: #b91c1c;
      --danger-text: #b91c1c;     /* on --danger-bg 5.9:1 */
      --danger-bg: #fef2f2;
      --brand-label-size: 1.1875rem;
      --radius-sm: 0.25rem;
      --radius-md: 0.5rem;
      --transition-fast: 150ms ease-in-out;
    }

    [data-theme="dark"] {
      --color-background: #0a0a0a;
      --color-text: #e8e8e8;
      --text-secondary: hsl(0, 0%, 72%);
      --rule: rgba(232, 232, 232, 0.12);
      --border-dark: rgba(232, 232, 232, 0.36);
      --surface-band: hsl(36, 8%, 10%);
      --accent-dark: hsl(43, 100%, 48%);
      --focus-ring: hsl(216, 92%, 68%);
      --danger-text: #fca5a5;
      --danger-bg: #2a1010;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--color-background);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 3rem 1rem;
    }

    h1, h2, h3 {
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      letter-spacing: -0.02em;
    }

    .card {
      width: 100%;
      max-width: 34rem;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem 1.5rem;
      padding-bottom: 1.25rem;
      border-bottom: 2px solid var(--rule-strong);
    }

    /* logo.svg has ~14% side / ~24% top padding in its viewBox;
       pull it back so the mark aligns with the text column. */
    .logo {
      display: block;
      width: 168px;
      height: auto;
      margin: -13px 0 -13px -23px;
    }

    /* Eyebrow label with the landing's short yellow rule */
    .header h1 {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .header h1::before {
      content: '';
      width: 2rem;
      height: 2px;
      background: var(--accent-dark);
    }

    .content {
      padding: 2.5rem 0;
    }

    .icon {
      display: block;
      width: 28px;
      height: 28px;
      margin-bottom: 1.25rem;
    }

    [data-theme="dark"] .icon {
      filter: invert(1) brightness(1.2);
    }

    .content h2 {
      font-size: clamp(1.5rem, 1.2rem + 1.2vw, 1.875rem);
      font-weight: 600;
      line-height: 1.15;
      margin-bottom: 1rem;
    }

    .content p {
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.6;
      max-width: 52ch;
      margin-bottom: 1.5rem;
    }

    .email {
      display: inline-block;
      max-width: 100%;
      overflow-wrap: anywhere;
      background: var(--surface-band);
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      padding: 0.625rem 1rem;
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: 2rem;
    }

    .email:empty {
      display: none;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    /* Flat, no lift — same shape and large-bold label as .btn--primary in style.css */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 48px;
      padding: 0.875rem 1.75rem;
      border: 2px solid transparent;
      border-radius: var(--radius-md);
      font-family: 'Inter', sans-serif;
      font-size: var(--brand-label-size);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.005em;
      text-decoration: none;
      cursor: pointer;
      transition: background-color var(--transition-fast),
        border-color var(--transition-fast);
    }

    .btn:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .btn-primary {
      background: var(--danger);
      border-color: var(--danger);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--danger-hover);
      border-color: var(--danger-hover);
    }

    .btn-primary:disabled {
      background: #6b7280;
      border-color: #6b7280;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: transparent;
      color: var(--color-text);
      border-color: var(--border-dark);
    }

    .btn-secondary:hover {
      border-color: var(--color-text);
    }

    .footer {
      padding-top: 1.25rem;
      border-top: 1px solid var(--rule);
    }

    .footer p {
      color: var(--text-secondary);
      font-size: 0.8125rem;
    }

    .error {
      color: var(--danger-text);
      background: var(--danger-bg);
      border-left: 3px solid var(--danger);
      border-radius: var(--radius-sm);
      padding: 0.75rem 1rem;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    /* Spinner shown while the request is in flight (JS toggles display) */
    .loading {
      display: none;
      width: 1em;
      height: 1em;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: unsub-spin 0.8s linear infinite;
    }

    @keyframes unsub-spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      .buttons {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn {
        transition: none;
      }

      .loading {
        animation: none;
        border-right-color: currentColor;
        opacity: 0.6;
      }
    }
  </style>
  
  <script>
    // Dark mode detection
    (function() {
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <div class="card">
    <div class="header">
      <img src="../assets/logo.svg" alt="OnSeguros" class="logo">
      <h1>Newsletter</h1>
    </div>
    <div class="content">
      <img src="../assets/icons/mail.svg" alt="" class="icon" aria-hidden="true">
      <h2>¿Cancelar suscripción?</h2>
      <p>Estás por cancelar tu suscripción al newsletter de OnSeguros. Ya no recibirás notificaciones de nuevos artículos.</p>
      <div class="email" id="emailDisplay"></div>
      <div class="error" id="errorMessage" style="display: none;"></div>
      <div class="buttons">
        <button type="button" id="unsubscribeBtn" class="btn btn-primary">
          Sí, cancelar suscripción
          <span class="loading" aria-hidden="true"></span>
        </button>
        <a href="https://www.onseguros.net" class="btn btn-secondary">Volver al sitio</a>
      </div>
    </div>
    <div class="footer">
      <p>© 2026 OnSeguros · Río Cuarto, Córdoba, Argentina</p>
    </div>
  </div>

  <script>
    // Get parameters from URL
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email');
    const token = params.get('token');

    // Display email
    if (email) {
      document.getElementById('emailDisplay').textContent = email;
    } else {
      showError('Link de cancelación inválido.');
    }

    // Handle unsubscribe
    document.getElementById('unsubscribeBtn').addEventListener('click', async () => {
      const btn = document.getElementById('unsubscribeBtn');
      const loading = btn.querySelector('.loading');
      const errorDiv = document.getElementById('errorMessage');
      
      btn.disabled = true;
      loading.style.display = 'inline-block';
      errorDiv.style.display = 'none';

      try {
        const apiUrl = 'https://tgokvwuiiglioegxgcpu.supabase.co/functions/v1/unsubscribe-api';
        const response = await fetch(`${apiUrl}?email=${encodeURIComponent(email)}&token=${token}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          }
        });

        if (response.ok) {
          // Redirect to success page (relative path works both locally and in production)
          window.location.href = `./success.html?email=${encodeURIComponent(email)}`;
        } else {
          const data = await response.json();
          showError(data.error || 'Error al cancelar la suscripción');
          btn.disabled = false;
          loading.style.display = 'none';
        }
      } catch (error) {
        showError('Error de conexión. Por favor, intentá de nuevo.');
        btn.disabled = false;
        loading.style.display = 'none';
      }
    });

    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
    }
  </script>
</body>
</html>
