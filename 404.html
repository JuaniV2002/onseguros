<!DOCTYPE html>
<html lang="es-AR">

<head>
    <script>
        // Prevent flash of wrong theme - runs before CSS loads
        (function () {
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Página no encontrada - OnSeguros</title>

    <!-- Favicon -->
    <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/assets/icons/favicon.png" type="image/png">

    <!-- Fonts -->
    <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        /* Self-hosted fonts: copy of the @font-face rules at the top of assets/css/style.css */
        /* latin-ext */
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 300 700;
            font-display: swap;
            src: url(/assets/fonts/inter-latin-ext.woff2) format('woff2');
            unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }
        /* latin */
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 300 700;
            font-display: swap;
            src: url(/assets/fonts/inter-latin.woff2) format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        /* latin-ext */
        @font-face {
            font-family: 'Space Grotesk';
            font-style: normal;
            font-weight: 300 700;
            font-display: swap;
            src: url(/assets/fonts/space-grotesk-latin-ext.woff2) format('woff2');
            unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }
        /* latin */
        @font-face {
            font-family: 'Space Grotesk';
            font-style: normal;
            font-weight: 300 700;
            font-display: swap;
            src: url(/assets/fonts/space-grotesk-latin.woff2) format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        /* Self-contained: this page does not load style.css. Token values are
           copied from assets/css/style.css (:root light / [data-theme="dark"]). */
        :root {
            --color-background: #fbfbfe;
            --color-text: #101016;
            --text-secondary: hsl(240, 16%, 37%);
            --rule: rgba(16, 16, 22, 0.1);
            --rule-strong: var(--color-text);
            --border-dark: rgba(16, 16, 22, 0.3);
            --color-accent: #f7ca43;
            --brand-blue: #2e7ef6;
            --brand-blue-strong: #0f68eb;
            --brand-blue-hover: hsl(216, 92%, 47%);
            --on-brand: #ffffff;
            --brand-label-size: 1.1875rem;
            --focus-ring: hsl(216, 92%, 42%);
            --radius-md: 0.5rem;
            --transition-fast: 150ms ease-in-out;
        }

        [data-theme="dark"] {
            --color-background: #0a0a0a;
            --color-text: #e8e8e8;
            --text-secondary: hsl(0, 0%, 72%);
            --rule: rgba(232, 232, 232, 0.12);
            --border-dark: rgba(232, 232, 232, 0.36);
            --color-accent: #ffc947;
            --focus-ring: hsl(216, 92%, 68%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--color-background);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 3rem 1rem;
        }

        .error-container {
            width: 100%;
            max-width: 40rem;
            margin: 0 auto;
        }

        .error-logo {
            display: inline-block;
            margin-bottom: 3.5rem;
        }

        /* logo.svg has ~14% side / ~24% top padding in its viewBox;
           pull it back so the mark aligns with the text column. */
        .error-logo img {
            display: block;
            height: 60px;
            width: auto;
            margin: -14px 0 -14px -25px;
        }

        .error-code {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            font-size: clamp(5rem, 3.5rem + 7vw, 8.5rem);
            font-weight: 700;
            line-height: 0.95;
            letter-spacing: -0.04em;
            color: var(--color-text);
            margin-bottom: 2rem;
            font-variant-numeric: tabular-nums;
            text-decoration-line: underline;
            text-decoration-color: var(--color-accent);
            text-decoration-thickness: 0.08em;
            text-underline-offset: 0.1em;
            text-decoration-skip-ink: none;
        }

        .error-title {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            font-size: clamp(1.5rem, 1.2rem + 1.2vw, 1.875rem);
            font-weight: 600;
            line-height: 1.15;
            letter-spacing: -0.02em;
            padding-top: 1.25rem;
            border-top: 2px solid var(--rule-strong);
            margin-bottom: 1rem;
        }

        .error-description {
            font-size: 1.125rem;
            line-height: 1.6;
            color: var(--text-secondary);
            max-width: 52ch;
            margin-bottom: 2.5rem;
        }

        .error-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        /* Mirrors .btn--primary / .btn--secondary in style.css: flat, no lift.
           White on --brand-blue-strong is 5.0:1; label stays 19px / 700. */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0.875rem 2rem;
            border: 2px solid transparent;
            border-radius: var(--radius-md);
            font-family: 'Inter', sans-serif;
            font-size: var(--brand-label-size);
            font-weight: 700;
            line-height: 1.25;
            letter-spacing: -0.005em;
            text-decoration: none;
            transition: background-color var(--transition-fast),
                border-color var(--transition-fast);
        }

        .btn:focus-visible {
            outline: 2px solid var(--focus-ring);
            outline-offset: 2px;
        }

        .btn-primary {
            background-color: var(--brand-blue-strong);
            border-color: var(--brand-blue-strong);
            color: var(--on-brand);
        }

        .btn-primary:hover,
        .btn-primary:active {
            background-color: var(--brand-blue-hover);
            border-color: var(--brand-blue-hover);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--color-text);
            border-color: var(--border-dark);
        }

        .btn-secondary:hover,
        .btn-secondary:active {
            border-color: var(--color-text);
        }

        @media (max-width: 480px) {
            .error-logo {
                margin-bottom: 2.5rem;
            }

            .error-logo img {
                height: 50px;
                margin: -12px 0 -12px -21px;
            }

            .error-description {
                font-size: 1rem;
            }

            .error-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .btn {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <div class="error-container">
        <div class="error-logo">
            <img src="/assets/logo.svg" alt="OnSeguros" width="160" height="40">
        </div>
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Página no encontrada</h2>
        <p class="error-description">
            Lo sentimos, la página que estás buscando no existe o ha sido movida.
            Podés volver al inicio o contactarnos si necesitás ayuda.
        </p>
        <div class="error-actions">
            <a href="/" class="btn btn-primary">Volver al Inicio</a>
            <a href="/#contacto" class="btn btn-secondary">Contactar</a>
        </div>
    </div>

    <script>
        // Log the attempted URL for debugging
        console.log('404 Error - Attempted URL:', window.location.href);
    </script>
</body>

</html>
