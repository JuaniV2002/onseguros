<!doctype html>
<html><head><meta charset="utf-8">
<!-- standalone copy: loads the system styles itself -->
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><style>body{padding:24px;}</style></head>
<body>
<div class="chat-card" style="max-width:760px">
  <div class="chat-window"><div class="chat-messages">
    <div class="chat-message chat-message--agent"><div class="chat-avatar" aria-hidden="true">O</div><div class="chat-bubble chat-bubble--agent"><p>¡Hola! Soy <strong>Oni</strong>, tu Agente de IA de OnSeguros 👋</p><p>¿Qué tipo de seguro necesitás cotizar hoy?</p></div></div>
    <div class="chat-message chat-message--user"><div class="chat-bubble chat-bubble--user"><p>Quiero cotizar un seguro para mi comercio</p></div></div>
    <div class="chat-message chat-message--agent"><div class="chat-avatar" aria-hidden="true">O</div><div class="chat-bubble chat-bubble--agent"><div class="typing-dots"><span></span><span></span><span></span></div></div></div>
  </div></div>
  <div class="chat-suggestions"><button class="suggestion-chip">Automotor</button><button class="suggestion-chip">Hogar</button><button class="suggestion-chip">ART</button><button class="suggestion-chip">Agrícola</button><button class="suggestion-chip">Comercio</button></div>
  <div class="chat-divider"></div>
  <form class="chat-input-area" onsubmit="return false"><div class="chat-input-wrapper"><textarea class="chat-input" rows="1" placeholder="Escribí tu mensaje..." aria-label="Escribir mensaje"></textarea><button type="submit" class="chat-send-btn" aria-label="Enviar mensaje"><img src="../../assets/Icons/send.svg" alt="" class="chat-send-icon"></button></div><p class="chat-input-hint">Presioná <kbd>Enter</kbd> para enviar · <kbd>Shift</kbd>+<kbd>Enter</kbd> para nueva línea</p></form>
</div>
</body></html>
