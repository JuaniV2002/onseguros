<!doctype html>
<html><head><meta charset="utf-8">
<!-- standalone copy: loads the system styles itself -->
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><style>body{padding:24px;}</style></head>
<body>
<div class="blog-grid" aria-busy="true">
  <div class="blog-card" aria-hidden="true"><span class="blog-card__date"><span class="skeleton-line" style="--w:10em"></span></span><h2 class="blog-card__title"><span class="skeleton-line" style="--w:74%"></span><span class="skeleton-line" style="--w:58%"></span></h2><p class="blog-card__description"><span class="skeleton-line"></span><span class="skeleton-line skeleton-line--m"></span><span class="skeleton-line" style="--w:72%"></span></p><span class="blog-card__read-more"><span class="skeleton-line" style="--w:5.9em"></span></span></div>
</div>
<div class="faq-list accordion-list" aria-busy="true" style="margin-top:24px">
  <div class="accordion-item" aria-hidden="true"><div class="accordion-question"><span><span class="skeleton-line" style="--w:78%"></span><span class="skeleton-line skeleton-line--m" style="--w:55%"></span></span><img src="../../assets/Icons/chevron-down.svg" alt=""></div></div>
  <div class="accordion-item" aria-hidden="true"><div class="accordion-question"><span><span class="skeleton-line" style="--w:64%"></span></span><img src="../../assets/Icons/chevron-down.svg" alt=""></div></div>
</div>
<div class="admin" style="padding:24px;margin:24px -24px -24px">
  <div class="posts-list is-skeleton" aria-hidden="true"><div class="post-item"><div class="post-item-content"><h3 class="post-item-title"><span class="skeleton-line" style="--w:62%"></span></h3><p class="post-item-description"><span class="skeleton-line"></span><span class="skeleton-line" style="--w:72%"></span></p><div class="post-item-meta"><span class="skeleton-line" style="--w:5.4em"></span><span>•</span><span class="post-item-slug"><span class="skeleton-line" style="--w:16em"></span></span></div></div><div class="post-item-actions"><span class="btn btn-sm btn-primary">Editar</span><span class="btn btn-sm btn-secondary">Publicar</span><span class="btn btn-sm btn-danger">Descartar</span></div></div></div>
</div>
</body></html>
