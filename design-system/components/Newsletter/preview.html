<!doctype html>
<html><head><meta charset="utf-8">
<!-- standalone copy: loads the system styles itself -->
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><style>body{padding:24px;}</style></head>
<body>
<section class="newsletter"><div class="newsletter__container">
  <div class="newsletter__content"><h2 class="newsletter__title">Suscribite al Newsletter</h2><p class="newsletter__description">Recibí cada viernes consejos sobre seguros, novedades del sector y contenido exclusivo directo en tu correo.</p></div>
  <form class="newsletter__form" onsubmit="return false"><div class="newsletter__form-group"><label class="sr-only" for="ne" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Tu dirección de email</label><input type="email" id="ne" class="newsletter__input" placeholder="Tu email"><button class="newsletter__button btn btn--primary">Suscribirme</button></div>
  <div class="newsletter__success" role="status">¡Listo! Te suscribiste al newsletter.</div>
  <p class="newsletter__consent">Al suscribirte aceptás nuestra <a href="#">política de privacidad</a>. Enviamos emails los viernes.</p></form>
</div></section>
</body></html>
